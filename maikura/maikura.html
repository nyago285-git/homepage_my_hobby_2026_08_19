<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>マイクラ</title>

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div id="bubble-container"></div>

  <!-- ここからコンテンツ全体を囲む -->
  <div class="content-wrapper">
    
    <a href="../index.html" class="back-link">← 趣味一覧（トップ）へ戻る</a><br>
    <a href="../game.html" class="back-link">← ゲーム一覧（一つ前）へ戻る</a>

    <h1>マイクラ（下の内容はまだ適当）</h1>

    <!-- タブボタン -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab(event, 'tab-build')">建築ギャラリー</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-redstone')">自動化装置</button>
    </div>

    <!-- 【建築ギャラリー】タブの中身 -->
    <div id="tab-build" class="tab-content active">
      <div id="build-gallery" class="gallery-grid"></div>
    </div>

    <!-- 【自動化装置】タブの中身（次回ここに装置メモを作ります） -->
    <div id="tab-redstone" class="tab-content">
      <div class="info-card">
        <h3>自動化装置・回路メモ</h3>
        <p>準備中...</p>
      </div>
    </div>

  </div>

    <!-- ここから詳細表示用ポップアップ（モーダル） -->
    <div id="build-modal" class="modal">
      <div class="modal-content info-card">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h2 id="modal-title">建築タイトル</h2>
        <img id="modal-image" src="" alt="">
        <div class="modal-details">
          <h4 style="color: #ffaa00;">■ 必要な材料（目安）</h4>
          <p id="modal-materials">材料リスト</p>
          <h4 style="color: #00f5d4; margin-top: 15px;">■ 作り方の手順</h4>
          <ul id="modal-steps">
          <!-- ここに手順が自動で入ります -->
          </ul>
        </div>
      </div>
    </div>

  <script src="bubble.js"></script>
  <script src="maikura_tabs.js"></script>
</body>
</html>
